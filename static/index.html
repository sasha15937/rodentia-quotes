<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цитаты</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="icon" type="image/x-icon" href="/styles/image/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <script src="scripts/headfoot.js" defer></script>
    <!-- <script src="scripts/card-test.js" defer></script> -->
</head>

<body>
    <header id="header-part"></header>
    <section class="qbody">
        <div class="quote single">
            <img src="styles/image/quote-breck.svg" class="quote-breck">
            <div class="block-quote">ыфв</div>
            <div class="about-quote">
                <div class="author-quote"><span>a</span></div>
                <div class="tags-quote"><span class="tag">1</span></div>
            </div>
            <img src="styles/image/quote-breck-back.svg" class="quote-breck-back">
        </div>

        <div class="quote dialog">
            <img src="styles/image/quote-breck.svg" class="quote-breck">
            <div class="block-quote">
                <div class="dialog-line">
                    <div class="author-quote"><span>А</span></div>
                    <div class="text-quote"><span>&#8212; </span>ыфв</div>
                </div>
            </div>
            <div class="about-quote">
                <div class="tags-quote"><span class="tag">1</span></div>
            </div>
            <img src="styles/image/quote-breck-back.svg" class="quote-breck-back">
        </div>
    </section>
    <footer id="footer-part"></footer>

</body>

</html>
